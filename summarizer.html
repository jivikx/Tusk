<!DOCTYPE html>
<html>
<head>
    <title>AI Summarizer</title>
    <style>
        body { font-family: Arial; background: #eef2f3; margin: 0; }
        .nav { background: #222; padding: 10px; }
        .nav a { color: white; margin: 10px; text-decoration: none; }
        .container { padding: 20px; }
        textarea { width: 100%; height: 200px; padding: 10px; }
        button { padding: 10px 20px; margin-top: 10px; }
        .output { background: white; padding: 15px; margin-top: 15px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="nav">
    <a href="/">Home</a>
    <a href="/chatbot">Chatbot</a>
    <a href="/summarizer">Summarizer</a>
    <a href="/leaderboard">Leaderboard</a>
    <a href="/tracker">Study Tracker</a>
</div>

<div class="container">
    <h2>Text Summarizer</h2>

    <form method="POST">
        <textarea name="text" placeholder="Paste your text here..."></textarea><br>
        <button type="submit">Summarize</button>
    </form>

    <div class="output">
        <h3>Summary:</h3>
        <p>{{ summary if summary else "Your summary will appear here." }}</p>
    </div>
</div>

</body>
</html>
